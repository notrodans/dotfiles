<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<!-- Моноширинный шрифт для кода и терминала -->
	<alias>
		<family>monospace</family>
		<prefer>
			<family>JetBrainsMono Nerd Font Mono</family>
		</prefer>
	</alias>

	<!-- Шрифт для текста с засечками (serif) -->
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Fira Sans</family>
		</prefer>
	</alias>

	<!-- Шрифт для заголовков и титулов -->
	<alias>
		<family>sans</family>
		<prefer>
			<family>Fira Sans</family>
		</prefer>
	</alias>
</fontconfig>
