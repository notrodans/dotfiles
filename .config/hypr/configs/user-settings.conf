dwindle {
  pseudotile = 1
  preserve_split = 1
}

master {
  new_on_top=1
  mfact = 0.5
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  resize_on_border = 1

  layout = master
}

decoration {
  rounding = 0

  active_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = 1
  dim_strength = 0

  shadow {
    enabled = 0
  }

  blur {
	  enabled = 0
  }
}

animations {
  enabled = 0
}

input {
  kb_layout=us,ru
  # kb_layout=us+typo,ru:2+typo,ua:3+typo
  # kb_options=grp:alt_shift_toggle,ctrl:swapcaps
  kb_options=grp:alt_shift_toggle,compose:rctrl
  # kb_options=grp:caps_toggle,lv3:switch

  follow_mouse=1
  float_switch_override_focus=0
  repeat_rate=30
  repeat_delay=150
  numlock_by_default=0
  force_no_accel = 1
  scroll_method=on_button_down
  scroll_factor=2
}

misc {
  disable_hyprland_logo = 1
  disable_splash_rendering = 1
  mouse_move_enables_dpms = 1
  enable_swallow = 1
  focus_on_activate = 1
  swallow_regex = ^(kitty)$
}

cursor {
  no_hardware_cursors = 1
  use_cpu_buffer = 1
}

ecosystem {
  no_donation_nag = 1
  no_update_news = 0
}
