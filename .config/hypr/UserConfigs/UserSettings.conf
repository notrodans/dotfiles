# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User Settings
# This is where you put your own settings as this will not be touched during update

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables

# Sourcing colors generated by pywal
source = $HOME/.cache/wal/colors-hyprland

dwindle {
  pseudotile = yes
  preserve_split = yes
}

master {
  new_on_top=1
  mfact = 0.5
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  resize_on_border = 1
   
  # col.active_border = $color0 $color2 $color4 $color6 $color8 90deg
  # col.inactive_border = $backgroundCol

  layout = master
}

group {
  col.border_active = $color15

	groupbar {
	col.active = $color0
  }
}

decoration {
  rounding = 0
         
  active_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = 1
  dim_strength = 0

  shadow {
    enabled = 0
    range = 4
    render_power = 1
    color = $color2
    color_inactive = 0x50000000
  }

  blur {
	  enabled = 1
	  size = 5
	  passes = 2
	  ignore_opacity = 1
	  new_optimizations = 1
  }
}

animations {
  enabled = 0

  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = linear, 0.0, 0.0, 1.0, 1.0
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = slow, 0, 0.85, 0.3, 1
  bezier = overshot, 0.7, 0.6, 0.1, 1.1
  bezier = bounce, 1.1, 1.6, 0.1, 0.85
  bezier = sligshot, 1, -1, 0.15, 1.25
  bezier = nice, 0, 6.9, 0.5, -4.20
  
  # animation = windowsIn, 1, 5, slow, popin
  # animation = windowsOut, 1, 5, winOut, popin
  # animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 10, linear
  animation = borderangle, 1, 180, linear, loop #used by rainbow borders and rotating colors
  animation = fade, 1, 5, overshot
  animation = workspaces, 1, 2, wind
  animation = windows, 1, 2, bounce, popin
}

input {
  kb_layout=us+typo,ru:2+typo
  kb_options=grp:alt_shift_toggle
  # kb_options=grp:caps_toggle,lv3:switch

  follow_mouse=1
  repeat_rate=20
  repeat_delay=150
  numlock_by_default=0
  force_no_accel = 1
  scroll_method=on_button_down
  scroll_factor=2
}

misc {
  disable_hyprland_logo = 1
  disable_splash_rendering = 1
  mouse_move_enables_dpms = 1
  enable_swallow = 1
  focus_on_activate = 0
  swallow_regex = ^(kitty)$
}

cursor {
  no_hardware_cursors = 1
  use_cpu_buffer = true
}                     

ecosystem {
  no_donation_nag = 1
  no_update_news = 0
}
