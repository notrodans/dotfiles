name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find home tests -type f \
              \( -name '*.sh' -o -name 'executable_*.sh' \) \
              ! -name '*.tmpl' \
              -print0
          )

          if ((${#scripts[@]} > 0)); then
            shellcheck "${scripts[@]}"
          fi

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: tests/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: dotfiles-test:${{ strategy.job-index }}

      - name: Run installation test
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            dotfiles-test:${{ strategy.job-index }} \
            test
