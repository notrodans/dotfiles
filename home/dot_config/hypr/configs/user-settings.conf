dwindle {
	pseudotile = 1
	preserve_split = 1
}

master {
	new_on_top=1
	mfact = 0.5
}

general {
	gaps_in = 0
	gaps_out = 0
	border_size = 0
	resize_on_border = 1

	layout = master
}

decoration {
	rounding = 0

	active_opacity = 1.0
	fullscreen_opacity = 1.0

	dim_inactive = 0
	dim_strength = 0

	shadow {
		enabled = 0
	}

	blur {
	  enabled = 1
	}
}

animations {
	enabled = 0
}

input {
	kb_layout = us,ru
	kb_options = grp:alt_shift_toggle,compose:rctrl,ctrl:swapcaps

	follow_mouse = 1
	float_switch_override_focus = 0
	repeat_rate = 30
	repeat_delay = 150
	numlock_by_default = 0
	force_no_accel = 0
	scroll_method = on_button_down
	scroll_factor = 1
	focus_on_close = 0
	mouse_refocus = 0
}

input:touchpad {
	disable_while_typing = 1
	scroll_factor = 2
}

misc {
	disable_hyprland_logo = 1
	disable_splash_rendering = 1
	mouse_move_enables_dpms = 1
	enable_swallow = 1
	focus_on_activate = 1
	swallow_regex = ^(kitty)$
	font_family = "Hurmit Nerd Font"
}

cursor {
	no_warps = 1
	sync_gsettings_theme = 1
	no_hardware_cursors = 2
	enable_hyprcursor = 1
}

ecosystem {
	no_donation_nag = 1
	no_update_news = 0
}

xwayland {
	force_zero_scaling = 0
}

