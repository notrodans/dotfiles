[main]
font=IBM Plex Sans:size=12
dpi-aware=auto
prompt="› "
placeholder=Applications
icon-theme=Zafiro-Icons-Dark
icons-enabled=yes
fields=name,generic,exec,categories,keywords,comment
match-mode=fzf
show-actions=yes
terminal=kitty -e {cmd}
anchor=center
lines=10
width=42
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=1
minimal-lines=yes

[colors]
background=101010ff
text=bfc5d0ff
message=606060ff
prompt=859ba2ff
placeholder=606060ff
input=ced4dfff
match=dad4c3ff
selection=2e2e2eff
selection-text=ced4dfff
selection-match=dfdfdaff
counter=606060ff
border=424242ff

[border]
width=2
radius=5
selection-radius=3

[dmenu]
exit-immediately-if-empty=yes
