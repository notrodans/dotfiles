# backtraces_path = "/path/to/neovide_backtraces.log" # see below for the default platform specific location
# fork = false
# frame = "full"
# idle = true
maximized = false
# mouse-cursor-icon = "arrow"
neovim-bin = "/usr/sbin/nvim"
# no-multigrid = false
# srgb = false # platform-specific: false (Linux/macOS) or true (Windows)
# tabs = true
# theme = "auto"
# title-hidden = false
vsync = false
wsl = false

[font]
normal = ["Hurmit Nerd Font", "JetBrainsMono Nerd Font"] # Will use the bundled Fira Code Nerd Font by default
size = 13.5

[box-drawing]
# # "font-glyph", "native" or "selected-native"
mode = "native"

# [box-drawing.sizes]
# default = [2, 4] # Thin and thick values respectively, for all sizes
