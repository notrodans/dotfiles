# Monochrome for Kitty
# Ported from the pinned NvChad/base46 monochrome theme.
# ANSI colors follow the Base16 roles used by NvChad TreeSitter highlights.

foreground #bfc5d0
background #101010

selection_foreground #ced4df
selection_background #2e2e2e

cursor #ced4df
cursor_text_color #101010

# base00 / base03
color0  #101010
color8  #383838

# base08 / base09
color1  #eee8d5
color9  #B8B7B1

# base0B
color2  #7b9198
color10 #7b9198

# base0A
color3  #859ba2
color11 #859ba2

# base0D
color4  #ced4df
color12 #ced4df

# base0E / base0F
color5  #DAD4C3
color13 #ced4df

# base0C
color6  #DFDFDA
color14 #DFDFDA

# base05 / base07
color7  #bfc5d0
color15 #ced4df

# Tabs and borders
active_tab_foreground #ced4df
active_tab_background #242424
inactive_tab_foreground #606060
inactive_tab_background #1a1a1a
tab_bar_background #101010

active_border_color #859ba2
inactive_border_color #2e2e2e
