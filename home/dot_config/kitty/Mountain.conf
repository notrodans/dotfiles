background #0f0f0f

selection_foreground #f0f0f0
selection_background #191919

cursor #f0f0f0
cursor_text_color #0f0f0f

# base00 / base03
color0  #0f0f0f
color8  #222222

# base08 / base09
color1  #b18f91
color9  #d8bb92

# base0B
color2  #8aac8b
color10 #8aac8b

# base0A
color3  #b1ae8f
color11 #b1ae8f

# base0D
color4  #a5a0c2
