<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<include ignore_missing="no">/etc/fonts/fonts.conf</include>
	<!-- Если Chrome ищет Arial, отдаем Inter -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Arial</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Inter</string>
		</edit>
	</match>

	<!-- Если Chrome ищет стандартный sans-serif, тоже отдаем Inter -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>IBM Plex Sans</string>
		</edit>
	</match>
</fontconfig>
