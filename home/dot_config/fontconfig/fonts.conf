<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<include ignore_missing="no">/etc/fonts/fonts.conf</include>
	<!-- Monospace font for code and terminal -->
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Hurmit Nerd Font Mono</family>
		</prefer>
	</alias>

	<match target="pattern">
		<test qual="any" name="family">
			<string>monospace</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Hurmit Nerd Font Mono</string>
		</edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family">
			<string>Arial</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Sans-serif font for text -->
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>IBM Plex Sans</family>
		</prefer>
	</alias>

	<match target="pattern">
		<test qual="any" name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Font for headers and titles -->
	<alias>
		<family>serif</family>
		<prefer>
			<family>IBM Plex Sans</family>
		</prefer>
	</alias>

	<match target="pattern">
		<test qual="any" name="family">
			<string>serif</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<match target="font">
		<edit name="antialias" mode="assign">
			<bool>true</bool>
		</edit>
		<edit name="hinting" mode="assign">
			<bool>true</bool>
		</edit>
		<edit name="hintstyle" mode="assign">
			<const>hintslight</const>
		</edit>
		<edit name="rgba" mode="assign">
			<const>none</const>
		</edit>
		<edit name="lcdfilter" mode="assign">
			<const>lcddefault</const>
		</edit>
	</match>

	<!-- Arial -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Arial</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Helvetica & Helvetica Neue (Тяжелое наследие мак-верстки) -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Helvetica</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Helvetica Neue</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Calibri (Стандартный шрифт MS Office) -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Calibri</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Verdana -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Verdana</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Trebuchet MS -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Trebuchet MS</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Tahoma -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Tahoma</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>

	<!-- Segoe UI (Интерфейсный шрифт Windows) -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Segoe UI</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Sans</string>
		</edit>
	</match>


	<!-- ===== -->
	<!-- SERIF -->
	<!-- ===== -->

	<!-- Times New Roman -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Times New Roman</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Serif</string>
		</edit>
	</match>

	<!-- Times -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Times</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Serif</string>
		</edit>
	</match>

	<!-- Georgia  -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Georgia</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Serif</string>
		</edit>
	</match>

	<!-- Cambria -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Cambria</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Serif</string>
		</edit>
	</match>

	<!-- Garamond -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Garamond</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>IBM Plex Serif</string>
		</edit>
	</match>


	<!-- ======== -->
	<!-- MONOSPACE -->
	<!-- ======== -->

	<!-- Consolas -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Consolas</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Hurmit Nerd Font Mono</string>
		</edit>
	</match>

	<!-- Courier New -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Courier New</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Hurmit Nerd Font Mono</string>
		</edit>
	</match>

	<!-- Courier -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Courier</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
			<string>Hurmit Nerd Font Mono</string>
		</edit>
	</match>
</fontconfig>
